name: CI

# Запускается на каждый push и pull request в main или в ветки `claude/*`.
# Цель: поймать syntax-errors, нарушения стиля и регрессии в smoke-тестах
# до того как код доедет до Railway. Тесты используют SQLite (DB_PATH в
# tmp), поэтому Postgres-services в CI не нужен.

on:
  push:
    branches: [main, "claude/*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install runtime deps
        run: pip install -r requirements.txt

      - name: Install test deps
        run: pip install -r requirements-dev.txt

      # ruff = одновременно лайтовый линтер + проверка формата. Гоним
      # только базовые правила (errors, undefined names), не enforced
      # whole-codebase style yet — иначе на старте красная сборка
      # отвлечёт от настоящих проблем.
      - name: Lint with ruff
        run: ruff check --select=E9,F63,F7,F82 --statistics .

      - name: Run tests
        env:
          # Заглушки чтобы config импортировался без боевых секретов.
          # Реальные тесты переопределяют env через monkeypatch.
          TELEGRAM_TOKEN: "0:fake-ci-token"
          MS_TOKEN: "fake-ci"
        run: pytest tests/ -v --tb=short
