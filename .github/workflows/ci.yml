name: CI

# Запускается на каждый push и pull request в main или в ветки `claude/*`.
# Цель: поймать syntax-errors, нарушения стиля и регрессии в smoke-тестах
# до того как код доедет до Railway. Тесты используют SQLite (DB_PATH в
# tmp), поэтому Postgres-services в CI не нужен.

on:
  push:
    branches: [main, "claude/*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install runtime deps
        run: pip install -r requirements.txt

      - name: Install test deps
        run: pip install -r requirements-dev.txt

      # Строгий минимум (runtime-errors / undefined names) — отдельным
      # блокирующим шагом, чтобы в логе сразу было видно, если упало именно
      # это, а не «стиль».
      - name: Lint (strict gate)
        run: ruff check --select=E9,F63,F7,F82 --statistics .

      # Полный набор из pyproject.toml ([tool.ruff.lint]): F/B/ASYNC/UP/SIM —
      # нацелен на баги (неиспользуемые импорты, мутабельные дефолты,
      # async-ошибки), не на стиль.
      - name: Lint (full ruleset)
        run: ruff check --output-format=github .

      # mypy — точечно по «денежным»/API-модулям (см. pyproject [tool.mypy]).
      # Гейт: модули вычищены до нуля ошибок, дальше тип-регрессии блокируют CI.
      - name: Type-check
        run: mypy

      - name: Run tests
        env:
          # Заглушки чтобы config импортировался без боевых секретов.
          # Реальные тесты переопределяют env через monkeypatch.
          TELEGRAM_TOKEN: "0:fake-ci-token"
        # --cov-fail-under=55 — «храповик». Факт после T3.3 — ~67%: срез
        # бот-дублей убрал в основном НЕпокрытый код (экраны каталога,
        # аналитики, списков), поэтому прежний порог 35 стал бессмысленным.
        # Буфер ~12% защищает от шума метрики и оставляет место рефакторам,
        # но не даёт «забыть» дописать тесты к большим PR'ам.
        # `-m "not e2e"`: браузерные сценарии идут отдельным job'ом ниже —
        # здесь Chromium не ставится, и они бы просто пропустились.
        run: pytest tests/ -m "not e2e" -v --tb=short --cov --cov-report=term-missing --cov-fail-under=55

  # E2E (tests/e2e): настоящий Chromium грузит WebApp с живого uvicorn,
  # fetch настоящие, БД настоящая (SQLite). Ловит то, до чего не дотягиваются
  # ни API-тесты (фронта нет), ни jsdom-смоук (сервера нет): контракт
  # «что фронт шлёт ↔ что сервер ждёт ↔ что фронт рисует из ответа».
  # Отдельный job: медленнее pytest-гейта и требует браузера.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt -r requirements-dev.txt

      # --with-deps ставит системные библиотеки Chromium (apt) — без них
      # браузер не стартует на чистом ubuntu-latest.
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run E2E
        env:
          TELEGRAM_TOKEN: "0:fake-ci-token"
          # Без браузера e2e пропускаются (удобно локально); в CI пропуск —
          # это зелёная галочка над непрогнанными тестами, поэтому падаем.
          E2E_REQUIRED: "1"
        run: pytest tests/e2e -m e2e -v --tb=short

  # Фронт WebApp (webapp/static) теста-харнесса в Python нет — vitest гоняет
  # чистые хелперы (helpers.js) + jsdom-смоук, что app.js грузится без ошибок.
  # Отдельный job, чтобы не смешивать с pytest-гейтом.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # npm ci, а НЕ npm install: ставит строго по package-lock.json и падает,
      # если лок разошёлся с package.json. `npm install` в этой ситуации молча
      # правит лок — и CI проверял бы не тот набор версий, что лежит в репозитории.
      - name: Install frontend test deps
        run: npm ci

      - name: Run frontend tests (Vitest)
        run: npm test
