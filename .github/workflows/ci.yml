name: CI

# Запускается на каждый push и pull request в main или в ветки `claude/*`.
# Цель: поймать syntax-errors, нарушения стиля и регрессии в smoke-тестах
# до того как код доедет до Railway. Тесты используют SQLite (DB_PATH в
# tmp), поэтому Postgres-services в CI не нужен.

on:
  push:
    branches: [main, "claude/*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install runtime deps
        run: pip install -r requirements.txt

      - name: Install test deps
        run: pip install -r requirements-dev.txt

      # Строгий минимум (runtime-errors / undefined names) — отдельным
      # блокирующим шагом, чтобы в логе сразу было видно, если упало именно
      # это, а не «стиль».
      - name: Lint (strict gate)
        run: ruff check --select=E9,F63,F7,F82 --statistics .

      # Полный набор из pyproject.toml ([tool.ruff.lint]): F/B/ASYNC/UP/SIM —
      # нацелен на баги (неиспользуемые импорты, мутабельные дефолты,
      # async-ошибки), не на стиль.
      - name: Lint (full ruleset)
        run: ruff check --output-format=github .

      # mypy — точечно по «денежным»/API-модулям (см. pyproject [tool.mypy]).
      # Гейт: модули вычищены до нуля ошибок, дальше тип-регрессии блокируют CI.
      - name: Type-check
        run: mypy

      - name: Run tests
        env:
          # Заглушки чтобы config импортировался без боевых секретов.
          # Реальные тесты переопределяют env через monkeypatch.
          TELEGRAM_TOKEN: "0:fake-ci-token"
          MS_TOKEN: "fake-ci"
        # --cov-fail-under=35 — «храповик» с буфером 5-6% ниже фактических ~41%
        # (после PR #40: +9 ms_payments contract, +5 reject_shipment, +3 sentry
        # init dispatch = 17 новых). Buffer защищает от шума метрики (1-2%
        # колебание между прогонами) и оставляет пространство для рефакторов,
        # но не даёт «забыть» дописать тесты к большим PR'ам.
        run: pytest tests/ -v --tb=short --cov --cov-report=term-missing --cov-fail-under=35
