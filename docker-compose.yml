# Self-hosted развёртывание: Postgres + Redis + бот + WebApp + cron-задачи.
#
# Быстрый старт:
#   cp .env.example .env          # заполнить секреты
#   docker compose build
#   docker compose up -d          # migrate отработает сам, затем bot и webapp
#
# Секреты живут в .env рядом с этим файлом и в образ НЕ попадают
# (см. .dockerignore) — передаются рантаймом через env_file.

# ─── Общая часть для всех контейнеров приложения ────────────────────────────
# Якорь, чтобы bot, webapp, migrate и cron-задачи не разъезжались по
# окружению: одна правка — во всех сервисах сразу.
x-app: &app
  build:
    context: .
    args:
      # Версия работающего кода: cache-busting статики, `/healthz`, `/version`
      # в боте. Без неё всё это скатывается к таймстампу старта — кэш браузера
      # слетает на каждом рестарте, а «какой коммит работает» остаётся без
      # ответа. Подставляет их `scripts/deploy.sh`: руками забывают.
      GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-}
      GIT_COMMIT_MESSAGE: ${GIT_COMMIT_MESSAGE:-}
      GIT_BRANCH: ${GIT_BRANCH:-}
      # LibreOffice нужен юр. документам (расписки, services/legal_docs.py).
      # Не печатаете расписки — 0 экономит ~400 МБ образа.
      WITH_LIBREOFFICE: ${WITH_LIBREOFFICE:-1}
  image: moysklad-bot:local
  env_file: [.env]
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER:-bot}:${POSTGRES_PASSWORD_URLENC:?POSTGRES_PASSWORD_URLENC обязателен}@postgres:5432/${POSTGRES_DB:-moysklad_bot}
    REDIS_URL: redis://redis:6379/0
    # Бизнес-зона. КРИТИЧНО: created_at пишется в кадре контейнера
    # (utils.helpers.local_now), и «сегодня» в аналитике считается в нём же.
    # Поставите UTC при бизнесе в +5 — вечерние записи выпадут из «сегодня».
    TZ: ${TZ:-Asia/Tashkent}
    # Логотип накладной: файл кладётся в том appdata.
    INVOICE_LOGO_PATH: ${INVOICE_LOGO_PATH:-/app/data/logo.png}
    # ─── Печать (CUPS) ──────────────────────────────────────────────────────
    # В контейнере стоит только КЛИЕНТ (`lp`/`lpstat` из cups-client), демон
    # cupsd живёт на хосте. CUPS_SERVER говорит клиенту, куда идти.
    #
    # Пусто — печать выключается сама (`lp` не найдёт сервер, кнопка
    # «Распечатать» не рисуется). Так и должно быть там, где принтера нет.
    #
    # Хост-CUPS по TCP (вариант из .env.example):
    #   CUPS_SERVER=host.docker.internal:631
    # Требует на хосте в /etc/cups/cupsd.conf:
    #   Listen 172.17.0.1:631          # адрес docker-моста
    #   <Location />
    #     Order allow,deny
    #     Allow from 172.16.0.0/12     # подсети docker
    #   </Location>
    # и `systemctl restart cups`.
    #
    # Альтернатива без открытия TCP — пробросить unix-сокет. Тогда
    # CUPS_SERVER оставьте пустым и добавьте в volumes сервиса:
    #   - /run/cups/cups.sock:/run/cups/cups.sock
    # Сокет обычно принадлежит root:lp с правами 0660, а контейнер работает
    # под непривилегированным `app` — проверьте доступ (`docker compose exec
    # bot lpstat -p`), иначе печать будет молча отказывать.
    CUPS_SERVER: ${CUPS_SERVER:-}
    PRINTER_NAME: ${PRINTER_NAME:-Canon_MF272dw}
  volumes:
    # Логотип, шаблоны .docx и сгенерированные документы — переживают
    # пересборку образа.
    - appdata:/app/data
    # Печать: сокет CUPS хоста (каталог, а не файл — cupsd пересоздаёт
    # сокет при перезапуске, и привязка к файлу осталась бы на старом inode).
    # Сокет на хосте 0666, пользователю `app` доступен; CUPS_SERVER пустой —
    # клиент сам идёт в /run/cups/cups.sock. Без него `lp` в контейнере искал
    # несуществующий локальный cupsd: «очередь печати не найдена» (2026-09-15).
    - /run/cups:/run/cups
  # host.docker.internal на Linux сам не резолвится — Docker добавляет его
  # только по этой записи. Нужен для CUPS_SERVER=host.docker.internal:631.
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    redis: {condition: service_healthy}
  restart: unless-stopped
  networks:
    - backend

services:
  redis:
    image: redis:7-alpine
    # appendonly: FSM-состояния (черновики заказов) переживают рестарт.
    # Без Redis бот откатится на MemoryStorage и потеряет их при каждом
    # перезапуске — на своём сервере это заметно.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    # Без этого redis остаётся в дефолтной сети compose-проекта, а bot/webapp/
    # migrate сидят в backend (она же external — там реальный postgres). Сети
    # не пересекаются, имя `redis` не резолвится, и бот падает с
    # «Error -3 connecting to redis:6379».
    networks:
      - backend

  # ─── Схема БД ─────────────────────────────────────────────────────────────
  migrate:
    <<: *app
    # Отдельный одноразовый контейнер, а не шаг в CMD приложения: схему
    # разворачивает ОДИН процесс перед стартом сервисов. Если зашить миграцию
    # в запуск bot и webapp, они стартуют наперегонки.
    command: ["python", "-m", "tasks.migrate"]
    restart: "no"

  # ─── Приложение ───────────────────────────────────────────────────────────
  bot:
    <<: *app
    environment:
      # YAML-мердж не объединяет вложенные мапы: повторяем блок целиком,
      # иначе environment якоря затрётся, а не дополнится.
      DATABASE_URL: postgresql://${POSTGRES_USER:-bot}:${POSTGRES_PASSWORD_URLENC:?POSTGRES_PASSWORD_URLENC обязателен}@postgres:5432/${POSTGRES_DB:-moysklad_bot}
      REDIS_URL: redis://redis:6379/0
      TZ: ${TZ:-Asia/Tashkent}
      INVOICE_LOGO_PATH: ${INVOICE_LOGO_PATH:-/app/data/logo.png}
      # Печать живёт в боте: кнопка под печатной формой и /printer.
      CUPS_SERVER: ${CUPS_SERVER:-}
      PRINTER_NAME: ${PRINTER_NAME:-Canon_MF272dw}
      BOT_MODE: bot
    depends_on:
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}

  webapp:
    <<: *app
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-bot}:${POSTGRES_PASSWORD_URLENC:?POSTGRES_PASSWORD_URLENC обязателен}@postgres:5432/${POSTGRES_DB:-moysklad_bot}
      REDIS_URL: redis://redis:6379/0
      TZ: ${TZ:-Asia/Tashkent}
      INVOICE_LOGO_PATH: ${INVOICE_LOGO_PATH:-/app/data/logo.png}
      CUPS_SERVER: ${CUPS_SERVER:-}
      PRINTER_NAME: ${PRINTER_NAME:-Canon_MF272dw}
      BOT_MODE: webapp
      PORT: "8080"
    depends_on:
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    ports:
      # Слушаем только localhost: Telegram требует публичный HTTPS, значит
      # снаружи всё равно стоит ваш reverse-proxy с сертификатом. Публиковать
      # 0.0.0.0 незачем — WebApp проверяет подпись initData, но открытый порт
      # это лишняя поверхность.
      - "127.0.0.1:${WEBAPP_PORT:-8080}:8080"
    healthcheck:
      # В образе нет ни curl, ни wget (python:slim) — проверяем Python'ом.
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ─── Cron-задачи ──────────────────────────────────────────────────────────
  # Профиль `cron` держит их вне `docker compose up`: это одноразовые прогоны,
  # а не демоны. Запускает их системный cron хоста (примеры внизу файла).
  # Свой планировщик в compose не добавляем — это лишняя зависимость и лишний
  # режим отказа там, где хватает crontab.
  cron-backup:
    <<: *app
    profiles: ["cron"]
    command: ["python", "-m", "tasks.run_backup"]
    restart: "no"

  cron-maintenance:
    <<: *app
    profiles: ["cron"]
    command: ["python", "-m", "tasks.run_maintenance"]
    restart: "no"

  cron-debts-notify:
    <<: *app
    profiles: ["cron"]
    command: ["python", "-m", "tasks.run_debts_notify"]
    restart: "no"

  cron-ops-monitor:
    <<: *app
    profiles: ["cron"]
    command: ["python", "-m", "tasks.run_ops_monitor"]
    restart: "no"

  cron-machines-archive:
    <<: *app
    profiles: ["cron"]
    command: ["python", "-m", "tasks.run_machines_archive"]
    restart: "no"

  cron-money-report:
    <<: *app
    profiles: ["cron"]
    command: ["python", "-m", "tasks.run_money_report"]
    restart: "no"

  cron-fx-sync:
    <<: *app
    profiles: ["cron"]
    command: ["python", "-m", "tasks.run_fx_sync"]
    restart: "no"

  cron-boss-digest:
    <<: *app
    profiles: ["cron"]
    command: ["python", "-m", "tasks.run_boss_digest"]
    restart: "no"

volumes:
  redisdata:
  appdata:

networks:
  backend:
    external: true

# ─── crontab хоста ───────────────────────────────────────────────────────────
# Запуск — через scripts/cron.sh: он делает `docker compose run --rm -T`,
# не даёт одной задаче наложиться на саму себя (flock) и пишет лог в
# logs/cron-<сервис>.log. Установленный на этом сервере crontab (хост в +05):
#
#   0 3 * * *     /srv/docker/moysklad_bot/scripts/cron.sh cron-maintenance
#   20 3 * * *    /srv/docker/moysklad_bot/scripts/cron.sh cron-backup
#   40 3 * * *    /srv/docker/moysklad_bot/scripts/cron.sh cron-machines-archive
#   30 10 * * *   /srv/docker/moysklad_bot/scripts/cron.sh cron-fx-sync
#   0 11 * * *    /srv/docker/moysklad_bot/scripts/cron.sh cron-debts-notify
#   30 11 * * *   /srv/docker/moysklad_bot/scripts/cron.sh cron-ops-monitor
#   15 11 * * 1   /srv/docker/moysklad_bot/scripts/cron.sh cron-money-report
#   */15 * * * *  /srv/docker/moysklad_bot/scripts/cron.sh cron-boss-digest
#
# cron-boss-digest гоняется каждые 15 минут НАРОЧНО (не раз в день): время
# дайджеста — настройка app_settings.boss_digest_time (дефолт 19:00
# Asia/Tashkent), а не расписание cron'а; сам таск решает, пора ли слать
# (services/boss_digest.py::is_due), и шлёт не больше раза в день.
#
# Время в crontab — в зоне ХОСТА, а не в TZ из .env. Если они разные,
# пересчитайте часы.
#
# ─── Разовый перенос из МойСклад ─────────────────────────────────────────────
# Нужен только если переезжаете с МС. MS_TOKEN задайте в .env на время прогона.
#   docker compose run --rm bot python -m scripts.migrate_from_moysklad --dry-run
#   docker compose run --rm bot python -m scripts.migrate_from_moysklad --apply
# Ненулевой код возврата = сверка не сошлась, переключаться нельзя.
#
# ─── Проверка печати ─────────────────────────────────────────────────────────
#   docker compose exec bot lpstat -p          # видит ли контейнер очередь
#   docker compose exec bot lp -d Canon_MF272dw /app/templates/legal/raspiska_ru.docx
# Пусто или «Unable to connect» — контейнер не достучался до CUPS хоста:
# смотрите CUPS_SERVER и настройки Listen/Allow в cupsd.conf.
