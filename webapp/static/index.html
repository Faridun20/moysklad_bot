<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>МойСклад</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="/static/style.css?v={{VERSION}}">
</head>
<body>

<!--
  Инлайн SVG-спрайт. Иконки stroke=currentColor → автоматически тематизируются
  под тёмную тему Telegram и тинтуются цветом родителя (активный таб, акцент).
  Рендерятся одинаково во всех клиентах (в отличие от эмодзи). Используется
  напрямую (<use href="#ic-…">) в статичной разметке ниже и через icon() из
  helpers.js в JS-шаблонах app.js.
-->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <g stroke="currentColor" stroke-width="1.75" fill="none"
       stroke-linecap="round" stroke-linejoin="round">
      <symbol id="ic-home" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></symbol>
      <symbol id="ic-cart" viewBox="0 0 24 24"><circle cx="9" cy="20" r="1.3"/><circle cx="18" cy="20" r="1.3"/><path d="M2 3h2.2l2.5 12.1a1 1 0 0 0 1 .8h8.8a1 1 0 0 0 1-.8L21 7H5.4"/></symbol>
      <symbol id="ic-wallet" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10h18"/><path d="M16 14.5h2"/></symbol>
      <symbol id="ic-chart" viewBox="0 0 24 24"><path d="M4 20V11"/><path d="M10 20V5"/><path d="M16 20v-7"/><path d="M21 20H3"/></symbol>
      <symbol id="ic-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></symbol>
      <symbol id="ic-cash" viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2.5"/><circle cx="12" cy="12" r="2.6"/><path d="M6 12h.01M18 12h.01"/></symbol>
      <symbol id="ic-box" viewBox="0 0 24 24"><path d="m21 8-9-5-9 5v8l9 5 9-5z"/><path d="m3 8 9 5 9-5"/><path d="M12 13v8"/></symbol>
      <symbol id="ic-plus" viewBox="0 0 24 24"><path d="M12 5v14"/><path d="M5 12h14"/></symbol>
      <symbol id="ic-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4.3l3 1.7"/></symbol>
      <symbol id="ic-cashbox" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M7 8V6a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v2"/><path d="M12 13v2"/></symbol>
      <symbol id="ic-gauge" viewBox="0 0 24 24"><path d="M21 13a9 9 0 1 0-18 0"/><path d="M12 13l4-3"/></symbol>
      <symbol id="ic-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
      <symbol id="ic-close" viewBox="0 0 24 24"><path d="M6 6l12 12"/><path d="M18 6 6 18"/></symbol>
      <symbol id="ic-truck" viewBox="0 0 24 24"><path d="M2 6h11v10H2z"/><path d="M13 9h4l4 4v3h-8z"/><circle cx="6.5" cy="18" r="1.6"/><circle cx="17.5" cy="18" r="1.6"/></symbol>
      <symbol id="ic-edit" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>
      <symbol id="ic-trash" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M6 6v14a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V6"/></symbol>
      <symbol id="ic-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
      <symbol id="ic-building" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="1.5"/><path d="M9 8h.01M15 8h.01M9 12h.01M15 12h.01M9.5 17h5"/></symbol>
      <symbol id="ic-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1.1"/><circle cx="3.5" cy="12" r="1.1"/><circle cx="3.5" cy="18" r="1.1"/></symbol>
      <symbol id="ic-return" viewBox="0 0 24 24"><path d="M3 8h11a5 5 0 0 1 0 10h-4"/><path d="M7 4 3 8l4 4"/></symbol>
      <symbol id="ic-lock" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol>
      <symbol id="ic-alert" viewBox="0 0 24 24"><path d="M12 3 2 20h20z"/><path d="M12 10v4"/><path d="M12 17.5h.01"/></symbol>
      <symbol id="ic-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 8h.01"/></symbol>
    </g>
  </defs>
</svg>

<div class="app">

  <header class="topbar">
    <div>
      <div class="title">МойСклад</div>
      <div class="subtitle" id="greeting">Загрузка…</div>
    </div>
    <div class="topbar-right">
      <button class="search-btn" id="search-btn" aria-label="Поиск">
        <svg class="ic"><use href="#ic-search"/></svg>
      </button>
      <div class="role-badge" id="role-badge"></div>
    </div>
  </header>

  <main class="content" id="content">
    <div class="spinner-wrap"><div class="spinner"></div><span>Подключение…</span></div>
  </main>

  <nav class="bottom-nav">
    <button class="nav-item active" data-screen="home">
      <span class="nav-icon"><svg class="ic"><use href="#ic-home"/></svg></span>
      <span class="nav-label">Главная</span>
    </button>
    <button class="nav-item" data-screen="orders">
      <span class="nav-icon"><svg class="ic"><use href="#ic-cart"/></svg></span>
      <span class="nav-label">Заказы</span>
    </button>
    <button class="nav-item" data-screen="finance">
      <span class="nav-icon"><svg class="ic"><use href="#ic-wallet"/></svg></span>
      <span class="nav-label">Финансы</span>
    </button>
    <button class="nav-item" data-screen="analytics">
      <span class="nav-icon"><svg class="ic"><use href="#ic-chart"/></svg></span>
      <span class="nav-label">Аналитика</span>
    </button>
  </nav>

</div>

<script src="/static/helpers.js?v={{VERSION}}"></script>
<script src="/static/app.js?v={{VERSION}}"></script>
</body>
</html>
