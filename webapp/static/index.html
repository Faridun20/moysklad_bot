<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>МойСклад</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="/static/style.css?v={{VERSION}}">
</head>
<body>

<div class="app">

  <header class="topbar">
    <div>
      <div class="title">МойСклад</div>
      <div class="subtitle" id="greeting">Загрузка…</div>
    </div>
    <div class="topbar-right">
      <button class="search-btn" id="search-btn" aria-label="Поиск">🔍</button>
      <div class="role-badge" id="role-badge"></div>
    </div>
  </header>

  <main class="content" id="content">
    <div class="spinner-wrap"><div class="spinner"></div><span>Подключение…</span></div>
  </main>

  <nav class="bottom-nav">
    <button class="nav-item active" data-screen="home">
      <span class="nav-icon">🏠</span>
      <span class="nav-label">Главная</span>
    </button>
    <button class="nav-item" data-screen="orders">
      <span class="nav-icon">🛒</span>
      <span class="nav-label">Заказы</span>
    </button>
    <button class="nav-item" data-screen="finance">
      <span class="nav-icon">💳</span>
      <span class="nav-label">Финансы</span>
    </button>
    <button class="nav-item" data-screen="analytics">
      <span class="nav-icon">📊</span>
      <span class="nav-label">Аналитика</span>
    </button>
  </nav>

</div>

<script src="/static/app.js?v={{VERSION}}"></script>
</body>
</html>
